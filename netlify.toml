[build]
  command = "rm -rf dist && mkdir -p dist/assets && cp index.html success.html robots.txt sitemap.xml googlea9420335e9b52691.html dist/ && cp -R archive dist/archive && cp -R baton-rouge dist/baton-rouge && cp assets/favicon.svg assets/axiom-og.png assets/site.css assets/site.js dist/assets/ && cp assets/ClashDisplay-Bold.woff2 dist/assets/ && cp assets/sales-line-test-call.m4a dist/assets/ && cp assets/br.js assets/video.js assets/axiom-explained-poster.jpg dist/assets/ && cp assets/firm.css assets/wordmark-ink.svg assets/wordmark-stone.svg assets/avatar.svg assets/founder.jpg dist/assets/ && cp -R assets/fonts assets/notes dist/assets/ && cp -R assets/axioma dist/assets/axioma && test -f dist/assets/axioma/vendor/rot.min.js && test -f dist/assets/axioma/vendor/LICENSE-rot-js.txt && test -f dist/assets/axioma/vendor/paper-liquid-metal.js && test -f dist/assets/axioma/vendor/LICENSE-Paper-Shaders.txt && test -f dist/assets/axioma/vendor/NOTICE-Paper-Shaders.txt && test -f dist/assets/axioma/vendor/cli-spinners-dots.json && test -f dist/assets/axioma/vendor/cli-spinners-dots.js && test -f dist/assets/axioma/vendor/LICENSE-cli-spinners.txt && cp -R field-reports dist/field-reports && cp -R assets/field-reports dist/assets/field-reports && cp -R notes dist/notes && cp -R privacy dist/privacy && cp -R terms dist/terms && cp -R sudoku dist/sudoku && cp -R assets/sudoku dist/assets/sudoku && cp -R operator-layer dist/operator-layer && cp assets/operator-layer.css assets/operator-layer.js dist/assets/ && cp 404.html favicon.ico dist/ && cp -R brief dist/brief"
  publish = "dist"
  # A298: assets/axioma is copied whole, including the narrow vendored builds:
  # vendor/paper-liquid-metal.js, vendor/cli-spinners-dots.json and licenses/NOTICE.

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src https://www.youtube-nocookie.com"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
