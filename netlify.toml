[build]
  command = "rm -rf dist && mkdir -p dist/assets && cp index.html success.html robots.txt sitemap.xml llms.txt googlea9420335e9b52691.html b642a8334de083c9a2979a007e4dba3e.txt dist/ && cp -R archive dist/archive && cp -R baton-rouge dist/baton-rouge && cp assets/favicon.svg assets/axiom-og.png assets/site.css assets/site.js dist/assets/ && cp assets/ClashDisplay-Bold.woff2 dist/assets/ && cp assets/sales-line-test-call.m4a dist/assets/ && cp assets/br.js assets/video.js assets/axiom-explained-poster.jpg dist/assets/ && cp assets/firm.css assets/wordmark-ink.svg assets/wordmark-stone.svg assets/avatar.svg assets/founder.jpg dist/assets/ && cp -R assets/fonts assets/notes dist/assets/ && cp -R assets/axioma dist/assets/axioma && test -f dist/assets/axioma/vendor/rot.min.js && test -f dist/assets/axioma/vendor/LICENSE-rot-js.txt && test -f dist/assets/axioma/vendor/paper-liquid-metal.js && test -f dist/assets/axioma/vendor/LICENSE-Paper-Shaders.txt && test -f dist/assets/axioma/vendor/NOTICE-Paper-Shaders.txt && test -f dist/assets/axioma/vendor/cli-spinners-dots.json && test -f dist/assets/axioma/vendor/cli-spinners-dots.js && test -f dist/assets/axioma/vendor/LICENSE-cli-spinners.txt && cp -R field-reports dist/field-reports && cp -R assets/field-reports dist/assets/field-reports && cp -R notes dist/notes && cp -R privacy dist/privacy && cp -R facts dist/facts && cp -R results dist/results && cp assets/results.css dist/assets/ && cp -R terms dist/terms && cp -R sudoku dist/sudoku && cp -R assets/sudoku dist/assets/sudoku && cp -R operator-layer dist/operator-layer && cp assets/operator-layer.css assets/operator-layer.js dist/assets/ && cp 404.html favicon.ico dist/ && cp -R brief dist/brief && cp -R plugins dist/plugins && cp -R paper-or-running dist/paper-or-running && cp assets/paper-or-running.css assets/paper-or-running.js dist/assets/ && cp assets/apple-touch-icon.png dist/assets/ && cp assets/axiom-og-plain.png assets/og.png dist/assets/ && cp assets/og-field-report.png dist/assets/ && mkdir -p dist/.well-known && cp .well-known/http-message-signatures-directory dist/.well-known/"
  publish = "dist"
  # A298: assets/axioma is copied whole, including the narrow vendored builds:
  # vendor/paper-liquid-metal.js, vendor/cli-spinners-dots.json and licenses/NOTICE.

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self'; img-src 'self' data:; connect-src https://cloudflareinsights.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src https://www.youtube-nocookie.com"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# A618: Axiom's agent key directory (Web Bot Auth, draft-ietf-webbotauth-httpsig-protocol).
# Public key only. The response carries its own signature (tag http-message-signatures-directory, over
# "@authority";req) so a copy on another host fails. Re-sign before it expires (see docs/agent-keys.md).
[[headers]]
  for = "/.well-known/http-message-signatures-directory"
  [headers.values]
    Content-Type = "application/http-message-signatures-directory+json"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"
    Signature-Input = "sig1=(\"@authority\";req);alg=\"ed25519\";keyid=\"KTM1LYy9u857Dgc65zU7hSZxpCD9ivQDTGQHEdIArTc\";created=1795547421;expires=1798139421;tag=\"http-message-signatures-directory\""
    Signature = "sig1=:+Us07p5r+ste/nYqMt9fZmRR5yKfdqkrUg0O9yvGL2KvQfZXs1r55NRWEaTmfxGTxhhZTJL9CfqYwsm6MJh2CA==:"
