[build]
  command = "rm -rf dist && mkdir -p dist/assets && cp index.html success.html robots.txt sitemap.xml googlea9420335e9b52691.html dist/ && cp -R archive dist/archive && cp -R baton-rouge dist/baton-rouge && cp assets/favicon.svg assets/axiom-og.png assets/site.css assets/site.js dist/assets/ && cp assets/Panchang-ExtraBold.woff2 dist/assets/ && cp assets/sales-line-test-call.m4a dist/assets/"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
